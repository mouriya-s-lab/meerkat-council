draft:
  goalTools: [pm_draft, pm_block]
  opening: |
    你在为议题 {{.Ref}}（议程编号 {{.Agenda}}，第 {{.Round}} 轮）起草决策表第 {{.Version}} 版。

    议题标题：{{.Title}}

    议题正文：
    {{.Body}}
    {{if .Escalation}}
    这个议题由实现 issue {{.Escalation.Issue}} 上的询问（评论 {{.Escalation.Ask}}）提出。询问原文：
    {{.Escalation.AskText}}

    pm_draft 必须给出 settle：kind 为 reply（定案后答复这条询问，text 是答复正文）或 replace（定案后另开 issue 取代该实现 issue）。
    {{end}}
    步骤：
    1. 先用 pm_proxy_read 向代码仓库提问，查清与本议题相关的入口文件、命令与数据存储位置（可用的仓库与模型见该工具的说明）。
    2. 需要时用 pm_read_issue 查阅 PM 仓库里的议题。
    3. 调用 pm_draft 提交决策表。每行 id 写成 "{{.Agenda}}-<两位序号>"，从 01 起；what、where（带文件路径）、how、tradeoff 写清楚；category 写这一行属于意图还是技术；missingDesign 表示设计书是否缺这部分；deliver 写要在哪个仓库建实现 issue（repo、title、body），不需要时为 null。supersedes 只有人类议题才填，普通议题为 []；withdrawn 为 null。

    如果本议题必须等某个尚未定案的人类议题先定案，改为调用 pm_block 指向它。pm_draft 或 pm_block 成功即结束本任务。
  continue: 你还没有成功调用 pm_draft 或 pm_block。按开场消息的要求完成决策表，调用 pm_draft 结束本任务；若工具返回错误，按错误修正后重试。
  resume: |
    你之前为议题 {{.Ref}} 起草决策表第 {{.Version}} 版的会话被中止，现已恢复。
    接着之前的进度完成起草：调用 pm_draft 提交决策表，或在必须等待人类议题时调用 pm_block。成功即结束本任务。
vote:
  goalTools: [pm_vote]
  opening: |
    你在对议题 {{.Ref}}（议程编号 {{.Agenda}}，第 {{.Round}} 轮）的决策表第 {{.Version}} 版投票。

    议题标题：{{.Title}}

    议题正文：
    {{.Body}}

    决策表（pm:draft 标记的 JSON）：
    {{.Draft}}

    逐行审查后调用 pm_vote：rows 覆盖决策表的每一行，每行一次，row 为该行 id；choice 为 approve、oppose 或 veto。
    oppose 必须给出可复现的反例 counterexample；veto 只限有否决权的席位，且 citation 必须是一个人类议题的 ref；classification 写你对该行分类（意图或技术）的意见，没有则为 null；不用的字段为 null。
    需要核对代码或设计书时用 pm_proxy_read，查阅议题用 pm_read_issue。pm_vote 成功即结束本任务。
  continue: 你还没有成功调用 pm_vote。审查决策表的每一行，调用 pm_vote 交出本席位的票；若工具返回错误，按错误修正后重试。
  resume: |
    你之前对议题 {{.Ref}} 决策表第 {{.Version}} 版投票的会话被中止，现已恢复。
    接着完成审查，调用 pm_vote 交出本席位的票，成功即结束本任务。
