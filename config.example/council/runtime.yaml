checkoutDir: /Users/mouriya/Ext/work/meerkat-council-local/checkouts
guardiansURL: http://127.0.0.1:7410
omp:
  executable: omp
  agentDir: /Users/mouriya/Ext/work/meerkat-council-local/omp
  extension: /Users/mouriya/Ext/code/meerkat-council/plugin/index.ts
  readyTimeoutSeconds: 120
  exitGraceSeconds: 30
