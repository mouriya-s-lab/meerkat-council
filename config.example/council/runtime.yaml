daemon:
  listen: 127.0.0.1:7421
  rebuildIntervalSeconds: 60
  # On a daemon stop, panels are cancelled and the daemon waits this long for them before exiting; the
  # HTTP server takes up to 5 more seconds. The deployment's stop timeout must exceed the sum.
  shutdownTimeoutSeconds: 15
